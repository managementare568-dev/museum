<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>museum:hndir</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f7f2;color:#34332e;font-family:'Yu Mincho','Hiragino Mincho ProN',Georgia,serif}header{text-align:center;padding:54px 16px 36px;border-bottom:1px solid #d9d6cd}h1{font-size:clamp(36px,7vw,66px);font-weight:400;letter-spacing:-2px;margin:8px}small{letter-spacing:.24em;color:#777}nav{display:flex;justify-content:center;gap:24px;margin-top:28px}button,select,input{font:inherit;color:inherit}button,select{background:transparent;border:1px solid #bdb9ad;padding:10px 14px;cursor:pointer}button.active{background:#34332e;color:white}main{max-width:1200px;margin:auto;padding:32px 20px}h2{font-weight:400;font-size:32px;margin:0 0 8px}.sub{color:#777;font-size:13px}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:28px 0;border-block:1px solid #ddd9cf;padding:14px 0}.tools select{margin-right:auto}.gallery{display:grid;grid-template-columns:1fr;gap:48px}.gallery.six{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}figure{margin:0;min-width:0}figure img,.placeholder{width:100%;display:block;object-fit:contain;background:#efede5}.gallery:not(.six) figure{max-width:650px;width:100%;margin:auto}.gallery.six img,.gallery.six .placeholder{aspect-ratio:1;object-fit:cover}.placeholder{aspect-ratio:4/3;display:grid;place-items:center;color:#8c887c;border:1px solid #dedad0}figcaption{padding:14px 0;border-bottom:1px solid #d9d6cd;overflow-wrap:anywhere}figcaption span{display:block;color:#777;font-size:12px;margin-top:6px}.six figcaption{font-size:11px}.six figcaption span{font-size:10px}dialog{background:#f8f7f2;border:1px solid #bdb9ad;width:min(90%,420px);padding:28px}dialog::backdrop{background:#0005}label{display:block;margin:16px 0}input{width:100%;padding:8px;border:1px solid #bbb;background:white}footer{text-align:center;padding:45px;color:#888;font-size:12px}progress{width:100%;height:12px;accent-color:#9b927e}#uploadinfo{font-size:13px;color:#777}button:disabled{opacity:.5;cursor:wait}figure img{cursor:zoom-in}.artistlink{border:0;padding:4px 0;text-decoration:underline;font-size:inherit}#view{width:min(96%,900px);max-height:95vh}#view img{display:block;max-width:100%;max-height:75vh;margin:auto;object-fit:contain}</style><section id="gate" style="max-width:420px;margin:12vh auto;padding:24px;text-align:center"><small>PRIVATE COLLECTION</small><h1>museum:hndir</h1><form id="login"><label>入館パスワード<input id="password" type="password" required autocomplete="current-password"></label><button>入館する</button></form><p id="loginmsg" role="status"></p></section><div id="inside" hidden><header><small>THE PRIVATE ART COLLECTION</small><h1>museum:hndir</h1><div class="sub">小さな美術館、ひとつひとつの世界。</div><nav><button onclick="window.scrollTo({top:0,behavior:'smooth'})">Entrance</button><button onclick="document.querySelector('main').scrollIntoView({behavior:'smooth'})">Gallery</button><button onclick="document.getElementById('dlg').showModal()">Exhibit ＋</button></nav></header><main><small>PERMANENT COLLECTION</small><h2>展示室</h2><div id="adminstatus" hidden>管理者モード</div><div class="sub" id="count"></div><div class="tools"><select id="artist" aria-label="作者で絞り込む"></select><button id="one" class="active">鑑賞</button><button id="six">収蔵庫</button></div><div id="gallery" class="gallery"></div></main><footer>museum:hndir — Private Collection<p><button id="logout">退館する</button> <button id="refresh">展示を更新</button> <button id="adminopen">管理者モード</button></p></footer></div><dialog id="admindlg"><form id="adminform"><h2>管理者認証</h2><label>管理者パスワード<input id="adminpass" type="password" required autocomplete="current-password"></label><button>解放する</button> <button type="button" onclick="document.getElementById('admindlg').close()">閉じる</button><p id="adminmsg" role="status"></p></form></dialog><dialog id="dlg"><form id="form"><h2>作品展示</h2><label>作品名（複数の場合は連番）<input id="work" placeholder="無題"></label><label>作者名<input id="author" required></label><label>つむぎのプロフィールURL（任意）<input id="profile" type="url" placeholder="https://…/?profile=…"></label><label>イラスト<input id="file" type="file" accept="image/*" multiple required></label><button type="submit">展示する</button> <button type="button" onclick="document.getElementById('dlg').close()">閉じる</button><p id="msg" role="status"></p><div id="uploadpanel" hidden><progress id="uploadbar" max="100" aria-label="画像送信進捗"></progress><p id="uploadinfo"></p><p id="elapsed" class="sub"></p></div></form></dialog><dialog id="view"><button onclick="document.getElementById('view').close()">閉じる ×</button><img id="large" alt=""><p id="viewcaption"></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);let items=[],db,isAdmin=false;const adminUid='95930706-563d-46ea-a567-ddc197d85b7b';const email='visitor@museum-hndir.example';
function error(e){return e?.message||String(e)}
function profileURL(value){if(!value)return '';try{const u=new URL(value.trim());const id=u.searchParams.get('profile');if(u.origin!=='https://tsumugi-netomo.constantnarwhal.chatgpt.site'||u.pathname!=='/'||!id||!(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)))return '';return u.origin+'/?profile='+id}catch{return ''}}
function knownProfile(name){const urls=[...new Set(items.filter(x=>x.artist===name).map(x=>profileURL(x.profile_url)).filter(Boolean))];return urls.length===1?urls[0]:''}
$('author').addEventListener('input',()=>{$('profile').value=knownProfile($('author').value.trim())});
function render(){let prev=$('artist').value;$('artist').replaceChildren(new Option('すべての作者',''));for(const a of new Set(items.map(x=>x.artist)))$('artist').add(new Option(a,a));$('artist').value=prev;let shown=items.filter(x=>!$('artist').value||x.artist===$('artist').value);$('count').textContent=shown.length+' 作品 / '+items.length+' 収蔵作品';$('gallery').replaceChildren();if(!shown.length){let p=document.createElement('div');p.className='placeholder';p.textContent='まだ展示作品はありません';$('gallery').append(p)}for(const x of shown){let f=document.createElement('figure'),im=document.createElement('img'),c=document.createElement('figcaption'),s=document.createElement('span');im.loading='lazy';im.src=x.src||'';im.alt=x.title||'無題';im.onerror=()=>{im.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'画像を表示できません。展示を更新してください。'}))};c.textContent=x.title||'無題';let url=profileURL(x.profile_url)||knownProfile(x.artist);let a=document.createElement(url?'a':'button');a.className='artistlink';a.textContent='Artist / '+x.artist+(url?' ↗':'');if(url){a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.style.color='inherit'}else{a.onclick=()=>{$('artist').value=x.artist;render();document.querySelector('main').scrollIntoView()}};s.append(a);im.onclick=()=>{$('large').src=x.src;$('large').alt=x.title||'無題';$('viewcaption').textContent=(x.title||'無題')+' / '+x.artist;$('view').showModal()};c.append(s);if(isAdmin){const controls=document.createElement('div');for(const [label,fn] of [['編集',()=>editArtwork(x)],['削除',()=>deleteArtwork(x)]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;controls.append(b)}c.append(controls)}f.append(im,c);$('gallery').append(f)}}
async function editArtwork(x){if(!isAdmin)return;const title=prompt('作品名',x.title||'無題');if(title===null)return;const artist=prompt('作者名',x.artist);if(artist===null)return;if(!artist.trim()){alert('作者名を入力してください');return}const raw=prompt('つむぎのプロフィールURL（空欄で解除）',profileURL(x.profile_url)||knownProfile(artist.trim()));if(raw===null)return;const profile_url=profileURL(raw);if(raw.trim()&&!profile_url){alert('つむぎの個人プロフィールURLを入力してください');return}try{const {data,error}=await db.from('artworks').update({title:title.trim()||'無題',artist:artist.trim(),profile_url:profile_url||null}).eq('id',x.id).select('id');if(error)throw error;if(!data.length)throw Error('編集権限がありません');await load()}catch(e){alert(error(e))}}
async function deleteArtwork(x){if(!isAdmin||!confirm('この作品を削除しますか？ 元に戻せません。'))return;try{const {data,error}=await db.from('artworks').delete().eq('id',x.id).select('id');if(error)throw error;if(!data.length)throw Error('削除権限がありません');const result=await db.storage.from('artworks').remove([x.image_path]);if(result.error)alert('作品情報は削除済みですが画像の削除に失敗：'+result.error.message);await load()}catch(e){alert(error(e))}}
async function load(){ $('count').textContent='読み込み中…';try{let all=[];for(let offset=0;;offset+=500){const {data,error}=await db.from('artworks').select('*').order('created_at').order('id').range(offset,offset+499);if(error)throw error;all.push(...data);if(data.length<500)break}for(let i=0;i<all.length;i+=100){let batch=all.slice(i,i+100);let {data,error}=await db.storage.from('artworks').createSignedUrls(batch.map(x=>x.image_path),3600);if(error)throw error;batch.forEach((x,j)=>x.src=data[j]?.signedUrl)}items=all;if(!$('profile').value)$('profile').value=knownProfile($('author').value.trim());render()}catch(e){$('count').textContent='展示の取得に失敗：'+error(e)}}
async function enter(){const {data}=await db.auth.getUser();isAdmin=data.user?.id===adminUid;$('adminstatus').hidden=!isAdmin;$('adminopen').textContent=isAdmin?'管理者モード終了（退館）':'管理者モード'; $('gate').hidden=true;$('inside').hidden=false;await load()}
$('artist').onchange=render;for(let id of ['one','six'])$(id).onclick=()=>{$('gallery').classList.toggle('six',id==='six');$('one').classList.toggle('active',id==='one');$('six').classList.toggle('active',id==='six')};
$('login').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;$('loginmsg').textContent='認証中…';try{if(!db)throw Error('接続ライブラリが読み込めません');let {error}=await db.auth.signInWithPassword({email:email,password:$('password').value});if(error)throw error;$('password').value='';$('loginmsg').textContent='';await enter()}catch(e){$('loginmsg').textContent='入館できません：'+error(e)}finally{b.disabled=false}};
$('adminopen').onclick=()=>{if(isAdmin){$('logout').click();return}$('adminmsg').textContent='';$('adminpass').value='';$('admindlg').showModal()};
$('adminform').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;$('adminmsg').textContent='認証中…';try{const {data,error:err}=await db.auth.signInWithPassword({email:'admin@museum-hndir.example',password:$('adminpass').value});if(err)throw err;if(data.user?.id!==adminUid){await db.auth.signOut();$('admindlg').close();$('inside').hidden=true;$('gate').hidden=false;throw Error('管理者UIDが一致しません')} $('adminpass').value='';$('admindlg').close();await enter()}catch(e){$('adminmsg').textContent='認証失敗：'+error(e);if($('inside').hidden)$('loginmsg').textContent=error(e)}finally{b.disabled=false}};
$('logout').onclick=async()=>{let {error}=await db.auth.signOut();if(error){alert(error.message);return}items=[];isAdmin=false;render();$('inside').hidden=true;$('gate').hidden=false};$('refresh').onclick=load;
async function compress(file){
if(!file||!file.size)throw Error('画像ファイルが空です');

let im, url;
try{
 try{if(typeof createImageBitmap!=='function')throw Error('非対応');im=await createImageBitmap(file)}catch(e){
 url=URL.createObjectURL(file); im=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('画像形式を読み込めません。JPEGまたはPNGでお試しください'));img.src=url;});}
 const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
 if(!w||!h)throw Error('画像の寸法を取得できません');
 for(const limit of [1000,800,640,480]){const scale=Math.min(1,limit/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));try{const ctx=c.getContext('2d');if(!ctx)throw Error('画像処理用メモリ不足');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);for(const q of [.78,.62,.45]){const blob=await new Promise((resolve,reject)=>{try{c.toBlob(resolve,'image/jpeg',q)}catch(e){reject(e)}});if(blob&&blob.type==='image/jpeg'&&blob.size<=250*1024)return blob;}}finally{c.width=c.height=1;}}
 throw Error('JPEG圧縮に失敗しました');
}finally{if(url)URL.revokeObjectURL(url);if(im&&typeof im.close==='function')im.close();}}
const projectUrl='https://mdkphliowhljldywjffy.supabase.co', publicKey='sb_publishable_i9Nhy_8BFSOTrTCJ-hfxdg_e3ojEy5j';
function sendImage(path,blob,token){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST',projectUrl+'/storage/v1/object/artworks/'+encodeURIComponent(path));xhr.setRequestHeader('apikey',publicKey);xhr.setRequestHeader('Authorization','Bearer '+token);xhr.setRequestHeader('Content-Type',blob.type);xhr.setRequestHeader('x-upsert','false');xhr.timeout=300000; xhr.upload.onprogress=e=>{if(e.lengthComputable){const percent=Math.min(100,Math.round(e.loaded/e.total*100));$('uploadbar').value=percent;$('uploadinfo').textContent=percent+'% — '+Math.round(e.loaded/1024)+' / '+Math.round(e.total/1024)+' KB';}};xhr.upload.onload=()=>{$('uploadbar').value=100;$('uploadinfo').textContent='100% — 送信完了・サーバー応答待ち';};xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300)resolve();else{let detail=xhr.responseText;try{let j=JSON.parse(detail);detail=j.message||j.error||detail}catch{}reject(Error('HTTP '+xhr.status+' '+detail));}};xhr.onerror=()=>reject(Error('通信エラー'));xhr.ontimeout=()=>reject(Error('通信が300秒以内に完了しませんでした'));xhr.onabort=()=>reject(Error('送信が中断されました'));xhr.send(blob);});}
try{$('author').value=localStorage.getItem('museum-author')||''}catch{};
$('form').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button[type=submit]'),close=e.target.querySelector('button[type=button]');b.disabled=close.disabled=true;let stage='画像読み込み・圧縮';let start=Date.now();$('uploadpanel').hidden=false;$('uploadbar').removeAttribute('value');$('uploadinfo').textContent='画像を準備しています';$('elapsed').textContent='経過時間：0秒';let timer=setInterval(()=>$('elapsed').textContent='経過時間：'+Math.floor((Date.now()-start)/1000)+'秒',1000);try{let files=Array.from($('file').files),artist=$('author').value.trim(),title=$('work').value.trim()||'無題';if(!artist)throw Error('作者名を入力してください');let raw=$('profile').value.trim();let profile_url=profileURL(raw)||(!raw?knownProfile(artist):'');if(raw&&!profile_url)throw Error('つむぎの個人プロフィールURLを入力してください');try{localStorage.setItem('museum-author',artist)}catch{};let completed=0,failures=[];for(let i=0;i<files.length;i++){let file=files[i];try{stage='画像読み込み・圧縮';$('msg').textContent=(i+1)+' / '+files.length+' — '+stage+'中…';$('uploadbar').removeAttribute('value');let blob=await compress(file);if(blob.size>300*1024)throw Error('容量超過');let session=await db.auth.getSession();if(session.error||!session.data.session)throw Error('再入館してください');stage='画像アップロード';$('msg').textContent=(i+1)+' / '+files.length+' — '+stage+'中…';$('uploadbar').value=0;$('uploadinfo').textContent='0% — 0 / '+Math.round(blob.size/1024)+' KB';let path=crypto.randomUUID()+'.jpg';await sendImage(path,blob,session.data.session.access_token);stage='作品情報の登録';$('msg').textContent=(i+1)+' / '+files.length+' — '+stage+'中…';let result=await db.from('artworks').insert({title:files.length>1?title+' '+(i+1):title,artist,image_path:path,profile_url:profile_url||null});if(result.error)throw result.error;completed++}catch(e){failures.push(file.name+'：'+stage+' — '+error(e))}}$('file').value='';$('work').value='';$('msg').textContent=completed+' / '+files.length+' 件 展示完了'+(failures.length?'。失敗：'+failures.join('；'):'');$('uploadinfo').textContent='処理終了';$('artist').value='';await load()}catch(e){$('msg').textContent=stage+'に失敗：'+error(e)}finally{clearInterval(timer);b.disabled=close.disabled=false}};
$('view').addEventListener('close',()=>{$('large').removeAttribute('src')});
$('dlg').addEventListener('cancel',e=>{if($('form').querySelector('button[type=submit]').disabled)e.preventDefault()});
(async()=>{try{db=window.supabase.createClient('https://mdkphliowhljldywjffy.supabase.co','sb_publishable_i9Nhy_8BFSOTrTCJ-hfxdg_e3ojEy5j');let {data,error}=await db.auth.getSession();if(error)throw error;if(data.session)await enter()}catch(e){$('loginmsg').textContent='接続エラー：'+error(e)}})();
